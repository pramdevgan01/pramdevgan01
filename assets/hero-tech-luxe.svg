<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <circle cx="240" cy="90" r="210" fill="url(#orbA)">
    <animate attributeName="cx" values="240;320;240" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="280" r="230" fill="url(#orbB)">
    <animate attributeName="cx" values="950;870;950" dur="18s" repeatCount="indefinite"/>
  </circle>
  <rect x="48" y="44" width="1104" height="252" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <rect x="50" y="46" width="1100" height="1" fill="#ffffff" fill-opacity="0.20"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="126" font-size="50" font-weight="600" fill="#f8fafc" letter-spacing="0.4">Pramatma Vishwakarma (Param)</text>
    <text x="600" y="168" font-size="14" letter-spacing="3.1" fill="#94a3b8">FULL-STACK DEVELOPER</text>
    <text x="600" y="202" font-size="13" letter-spacing="2.1" fill="#67e8f9">JAVA  ·  PYTHON  ·  JAVASCRIPT  ·  DOCKER  ·  AZURE</text>
    <text x="600" y="238" font-size="14" fill="#cbd5e1">Building modern software with architectural clarity and cloud-native discipline.</text>
  </g>
